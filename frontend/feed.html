<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#a855f7" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feed - Bondly</title>
  <link rel="icon" type="image/svg+xml" href="images/logo.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Navbar gets injected here by navbar.js -->
  <div id="navbar-container"></div>

  <div class="container">

    <!-- Loading Spinner (shown while fetching posts) -->
    <div class="spinner" id="loadingSpinner"></div>
<div style="display: flex; gap: 8px; margin-bottom: 16px;">
  <button class="btn btn-outline feed-tab active" data-sort="latest" style="width: auto; padding: 8px 20px;">🕒 Latest</button>
  <button class="btn btn-outline feed-tab" data-sort="trending" style="width: auto; padding: 8px 20px;">🔥 Trending</button>
</div>

    <!-- People to Follow -->
<div class="card suggestions-card" id="suggestionsCard" style="display: none;">
  <h3>👥 People you may know</h3>
  <div id="suggestionsList"></div>
</div>

<!-- Posts get injected here -->
<div id="postsContainer"></div>

  </div>

  <script src="js/utils.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/feed.js"></script>
</body>
</html>
