<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#a855f7" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - Bondly</title>
  <link rel="icon" type="image/svg+xml" href="images/logo.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="navbar-container"></div>

  <div class="container">
    <button class="back-btn" onclick="history.back()">← Back</button>
    <div class="card profile-header">
      <img id="profileImage" src="https://via.placeholder.com/100" alt="Profile" />
      <h2 id="profileName">Loading...</h2>
      <p id="profileUsername" style="color: var(--text-gray);"></p>
      <p id="profileBio" style="margin-top: 8px;"></p>

      <div class="profile-stats">
        <div>
          <div class="stat-number" id="postsCount">0</div>
          <div class="stat-label">Posts</div>
        </div>
        <div>
          <div class="stat-number" id="followersCount">0</div>
          <div class="stat-label">Followers</div>
        </div>
        <div>
          <div class="stat-number" id="followingCount">0</div>
          <div class="stat-label">Following</div>
        </div>
      </div>

      <button class="btn btn-primary" id="followBtn" style="width: auto; padding: 10px 28px;">Follow</button>
      <p id="mutualFollowersText" style="margin-top: 10px; font-size: 13px; color: var(--text-gray);"></p>
      <div style="margin-top: 14px;">
  <button id="moreOptionsBtn" style="background: none; border: none; color: var(--text-gray); font-size: 13px; cursor: pointer; text-decoration: underline;">More options</button>
  <div id="moreOptionsMenu" style="display: none; margin-top: 8px;">
    <button id="reportUserBtn" class="btn btn-outline" style="width: auto; padding: 6px 16px; font-size: 13px; margin-right: 8px;">🚩 Report</button>
    <button id="blockUserBtn" class="btn btn-outline" style="width: auto; padding: 6px 16px; font-size: 13px; color: var(--danger); border-color: var(--danger);">🚫 Block</button>
  </div>
</div>
    </div>

    <h3 style="margin: 20px 0 12px;">Posts</h3>
    <div class="spinner" id="loadingSpinner"></div>
    <div id="userPostsContainer"></div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/view-profile.js"></script>
</body>
</html>
