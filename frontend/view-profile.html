<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - Bondly</title>
  <link rel="icon" type="image/svg+xml" href="images/logo.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="navbar-container"></div>

  <div class="container">
    <div class="card profile-header">
      <img id="profileImage" src="https://via.placeholder.com/100" alt="Profile" />
      <h2 id="profileName">Loading...</h2>
      <p id="profileUsername" style="color: var(--text-gray);"></p>
      <p id="profileBio" style="margin-top: 8px;"></p>

      <div class="profile-stats">
        <div>
          <div class="stat-number" id="postsCount">0</div>
          <div class="stat-label">Posts</div>
        </div>
        <div>
          <div class="stat-number" id="followersCount">0</div>
          <div class="stat-label">Followers</div>
        </div>
        <div>
          <div class="stat-number" id="followingCount">0</div>
          <div class="stat-label">Following</div>
        </div>
      </div>

      <button class="btn btn-primary" id="followBtn" style="width: auto; padding: 10px 28px;">Follow</button>
    </div>

    <h3 style="margin: 20px 0 12px;">Posts</h3>
    <div class="spinner" id="loadingSpinner"></div>
    <div id="userPostsContainer"></div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/view-profile.js"></script>
</body>
</html>
