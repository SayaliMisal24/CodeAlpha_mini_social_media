<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In - Bondly</title>
  <link rel="icon" type="image/svg+xml" href="images/logo.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="auth-container">
    <div class="card">
      <div style="text-align: center; margin-bottom: 16px;">
  <img src="images/logo.svg" alt="Bondly" style="width: 56px; height: 56px;" />
</div>
<h2 style="margin-bottom: 24px; text-align: center; color: var(--primary-blue);">
  Welcome Back to Bondly
</h2>
      <h2 style="margin-bottom: 24px; text-align: center; color: var(--primary-blue);">
        Welcome Back
      </h2>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required />
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn">Log In</button>
      </form>

      <p style="text-align: center; margin-top: 16px; font-size: 14px;">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </p>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
