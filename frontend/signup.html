<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Bondly</title>
  <link rel="icon" type="image/svg+xml" href="images/logo.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="auth-container">
    <div class="card">
      <div style="text-align: center; margin-bottom: 16px;">
  <img src="images/logo.svg" alt="Bondly" style="width: 56px; height: 56px;" />
</div>
<h2 style="margin-bottom: 24px; text-align: center; color: var(--primary-blue);">
  Join Bondly
</h2>
      <h2 style="margin-bottom: 24px; text-align: center; color: var(--primary-blue);">
        Create Your Account
      </h2>

      <form id="signupForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Enter your full name" required />
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Choose a username" required />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email" required />
          <span class="error-text" id="emailError">Please enter a valid email address</span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" required />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter your password" required />
          <span class="error-text" id="passwordError">Passwords do not match</span>
        </div>

        <button type="submit" class="btn btn-primary" id="signupBtn">Sign Up</button>
      </form>

      <p style="text-align: center; margin-top: 16px; font-size: 14px;">
        Already have an account? <a href="login.html">Log In</a>
      </p>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
